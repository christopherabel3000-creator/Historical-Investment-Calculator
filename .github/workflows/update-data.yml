name: Update data

on:
  schedule:
    # Weekdays at 23:17 UTC: 6:17 PM Eastern in winter, 7:17 PM in summer,
    # after the market closes and the day's prices are posted.
    - cron: "17 23 * * 1-5"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the latest prices
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python tools/update.py

      - name: Rebuild the page
        working-directory: tools
        run: |
          python build_data.py data/sp.csv data/tbills.csv data/spy_adj.json returns.json \
            data/tbonds.csv data/yields_month_end.csv data/gold_monthly.csv data/gold_fmp_recent.csv \
            data/cpi_recent.csv data/btc_monthly.csv data/btc_last.txt
          python assemble.py

      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new data today."
            exit 0
          fi
          as_of=$(python -c 'import json; print(json.load(open("tools/returns.json"))["asOfDate"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update data through the $as_of close"
          git push
